name: CI — Ferretería

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ---------------------------------------------------------
  backend-tests:
    name: Backend — lint + pruebas (unit + integración)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ferreteria
          POSTGRES_PASSWORD: ferreteria123
          POSTGRES_DB: ferreteria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ferreteria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - name: Pruebas unitarias e integración
        env:
          TEST_DATABASE_URL: postgresql://ferreteria:ferreteria123@localhost:5432/ferreteria_test?schema=public
        run: npm test

  # ---------------------------------------------------------
  frontend-tests:
    name: Frontend — typecheck + pruebas de componentes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 arrastra undici 8, que exige Node >= 22.19; con Node 20 el worker de Vitest no arranca
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run

  # ---------------------------------------------------------
  e2e:
    name: E2E — Playwright contra el despliegue Docker
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Levantar el stack completo (docker compose)
        run: docker compose up -d --build
      - name: Esperar al API
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/api/health && exit 0
            sleep 2
          done
          echo "El API no respondió a tiempo" && exit 1
      - name: Instalar Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Ejecutar pruebas E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
          E2E_BASE_URL: http://localhost:8080
          E2E_API_URL: http://localhost:3001
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
